# Render Blueprint — backend web service.
# Frontend stays on Vercel. S3, Aiven MySQL, and Brevo stay as external services.
# First apply: fill every sync:false env var in the Render dashboard (do not commit secrets).

services:
  - type: web
    name: vaxify-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 30
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"

      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: "true"
      - key: DB_REQUIRE_SSL
        value: "true"
      - key: DB_VERIFY_CERT
        value: "false"

      - key: JWT_SECRET
        sync: false

      - key: AWS_ACCESS_KEY
        sync: false
      - key: AWS_SECRET_KEY
        sync: false
      - key: AWS_REGION
        value: ap-south-1
      - key: AWS_S3_BUCKET
        sync: false

      # Render free blocks outbound SMTP on 25/465/587. Brevo accepts 2525.
      - key: MAIL_HOST
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: "2525"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_AUTH
        value: "true"
      - key: MAIL_TLS
        value: "true"
      - key: MAIL_FROM_ADDRESS
        value: no-reply@vaxify.xyz
      - key: MAIL_FROM_NAME
        value: Vaxify Team

      - key: FRONTEND_URL
        value: https://vaxify.xyz
      - key: BACKEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://vaxify.xyz,https://www.vaxify.xyz
