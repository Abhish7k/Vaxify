[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vaxify-rag"
version = "1.0.0"
description = "Vaxify RAG knowledge-base ingestion service"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24,<2",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6",
    "google-genai>=1.0",
    "pinecone>=5.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "tenacity>=8.3",
    "structlog>=24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "pinecone: tests requiring Pinecone API credentials",
]

[tool.ruff]
line-length = 100
target-version = "py311"
