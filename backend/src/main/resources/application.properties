# spring.profiles.active=dev
spring.application.name=backend

# Render injects PORT (default 10000). Local/Docker fall back to 8080.
server.port=${PORT:8080}
server.address=0.0.0.0
server.shutdown=graceful
server.forward-headers-strategy=framework
spring.lifecycle.timeout-per-shutdown-phase=30s


# mysql database (Aiven requires SSL in production)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:vaxify}?useSSL=${DB_SSL:false}&requireSSL=${DB_REQUIRE_SSL:false}&verifyServerCertificate=${DB_VERIFY_CERT:false}&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:your_db_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# stay within Aiven connection limits; recycle before idle disconnects
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=300000


# jpa / hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=true


# jwt
jwt.secret=${JWT_SECRET:your_jwt_secret_at_least_32_characters_long}
jwt.expiration=${JWT_EXPIRATION:86400000}


# aws s3 configuration
aws.accessKey=${AWS_ACCESS_KEY:your_aws_access_key}
aws.secretKey=${AWS_SECRET_KEY:your_aws_secret_key}
aws.region=${AWS_REGION:ap-south-1}
aws.s3.bucket=${AWS_S3_BUCKET:vaxify-docs-bucket}


# file upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB


# email configuration (Brevo). Render free blocks outbound 25/465/587 — use 2525 there.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_TLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000


app.mail.from-address=${MAIL_FROM_ADDRESS:no-reply@vaxify.xyz}
app.mail.from-name=${MAIL_FROM_NAME:Vaxify Team}



# app configuration
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.backend.url=${BACKEND_URL:${RENDER_EXTERNAL_URL:http://localhost:8080}}
allowed.origins=${ALLOWED_ORIGINS:http://localhost:5173}


# actuator — Render health check; keep details private
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
