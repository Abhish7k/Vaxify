# Local backend only. Production runs on Render (see render.yaml).
services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_SSL=${DB_SSL:-false}
      - DB_REQUIRE_SSL=${DB_REQUIRE_SSL:-false}
      - DB_VERIFY_CERT=${DB_VERIFY_CERT:-false}
      - JWT_SECRET=${JWT_SECRET}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_AUTH=${MAIL_AUTH}
      - MAIL_TLS=${MAIL_TLS}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - FRONTEND_URL=${FRONTEND_URL}
      - BACKEND_URL=${BACKEND_URL:-http://localhost:8080}
      - RAG_SERVICE_URL=${RAG_SERVICE_URL:-http://host.docker.internal:8001}
      - RAG_CONNECT_TIMEOUT_MS=${RAG_CONNECT_TIMEOUT_MS:-5000}
      - RAG_READ_TIMEOUT_MS=${RAG_READ_TIMEOUT_MS:-60000}
      - RAG_INTERNAL_KEY=${RAG_INTERNAL_KEY}
    restart: unless-stopped
